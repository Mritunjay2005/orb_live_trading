name: Deploy to OCI Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "==> Deploy started at $(date -u)"
            cd /opt/orb_live_trading
            git fetch origin main
            git reset --hard origin/main
            docker rm -f $(docker ps -aq --filter name=grafana) 2>/dev/null || true
            docker-compose up -d --build --remove-orphans trading prometheus
            docker-compose up -d --no-deps grafana || true
            docker-compose ps
            docker-compose logs --tail=15 trading || true
            echo "==> Deploy finished at $(date -u)"
