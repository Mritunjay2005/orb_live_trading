#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose
  - curl
  - git
  - jq

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker opc
  - mkdir -p /opt/orb_live_trading
  - chown opc:opc /opt/orb_live_trading
  - |
    cat > /etc/systemd/system/orb-trading.service << 'EOT'
    [Unit]
    Description=ORB Live Trading stack
    After=docker.service
    Requires=docker.service

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    WorkingDirectory=/opt/orb_live_trading
    ExecStart=/usr/bin/docker-compose up -d
    ExecStop=/usr/bin/docker-compose down
    User=opc

    [Install]
    WantedBy=multi-user.target
    EOT
  - systemctl daemon-reload
  - echo "Cloud-init finished. SSH in, clone repo, place .env, then docker-compose up -d"

final_message: "ORB host ready. Convert the public IP to RESERVED and whitelist it in Upstox."
