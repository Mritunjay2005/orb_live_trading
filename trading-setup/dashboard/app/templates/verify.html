<!doctype html><html><head><title>Verify code</title>
<style>body{font-family:sans-serif;max-width:400px;margin:80px auto;text-align:center}
input{padding:10px;width:100%;box-sizing:border-box;margin-bottom:10px}
button{padding:10px 20px;width:100%}.err{color:red}</style></head>
<body>
<h2>Enter the code sent to {{ email }}</h2>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/verify-otp">
  <input type="hidden" name="email" value="{{ email }}">
  <input type="text" name="otp" placeholder="6-digit code" required>
  <button type="submit">Verify</button>
</form>
</body></html>
