<!doctype html><html><head><title>Trading Dashboard Login</title>
<style>body{font-family:sans-serif;max-width:400px;margin:80px auto;text-align:center}
input{padding:10px;width:100%;box-sizing:border-box;margin-bottom:10px}
button{padding:10px 20px;width:100%}</style></head>
<body>
<h2>Live Trading Dashboard</h2>

  <button type="submit">Send code</button>
</form>
</body></html>
